<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Little Website</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      color: #20233a;
      background: linear-gradient(135deg, #fce7f3, #e0e7ff);
    }
    .card {
      width: min(100%, 520px);
      padding: 36px 28px;
      text-align: center;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 24px;
      box-shadow: 0 16px 45px rgba(55, 48, 163, 0.14);
    }
    .emoji { font-size: 44px; }
    h1 { margin: 14px 0 10px; }
    p { line-height: 1.6; color: #5b6078; }
    button {
      margin-top: 12px;
      border: 0;
      border-radius: 999px;
      padding: 12px 22px;
      color: white;
      background: #6d5ce8;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover { background: #5544d0; }
    #message { min-height: 26px; font-weight: bold; color: #6d5ce8; }
  </style>
</head>
<body>
  <main class="card">
    <div class="emoji" aria-hidden="true">✨</div>
    <h1>Welcome to My Website!</h1>
    <p>This is a small, responsive webpage made with HTML, CSS, and JavaScript.</p>
    <button id="helloButton" type="button">Click Me</button>
    <p id="message" aria-live="polite"></p>
  </main>
  <script>
    document.getElementById("helloButton").addEventListener("click", function () {
      document.getElementById("message").textContent = "Hello! Thanks for visiting 💜";
    });
  </script>
</body>
</html>
